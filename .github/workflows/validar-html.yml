name: Validar sintaxis HTML

on:
  push:
    # IMPORTANTE: Asegúrate de que el nombre de tu rama sea 'main' o 'master'
    branches: [ "main", "master" ]

jobs:
  check-html:
    name: Validar sintaxis HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Validar HTML
        
        uses: path-to-file/html-validator-action@master
        # O podemos usar una alternativa más estándar como:
        # uses: htmlhint/htmlhint-action@v2
        # Nota: Si sigue fallando, prueba con la versión @v2 específica