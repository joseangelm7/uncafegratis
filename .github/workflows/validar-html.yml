name: Validar sintaxis HTML

# El proceso se dispara al hacer push a las ramas principales
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  check-html:
    name: Validar sintaxis HTML
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descargar el código del repositorio a la máquina virtual
      - name: Checkout del código
        uses: actions/checkout@v4

      # Paso 2: Ejecutar el validador real (HTMLHint)
      - name: Validar HTML con HTMLHint
        # Esta es la dirección REAL de la herramienta en GitHub
        uses: htmlhint/htmlhint-action@v2
        with:
          # Configuramos reglas básicas 
          rules: "tag-pair:true, spec-char-escape:true, id-unique:true, src-not-empty:true"